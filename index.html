<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Modern Blog | Loading...</title>
    <meta name="description" content="A modern, fast, and SEO-optimized blogging platform built with React and Firebase." />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f9fa;
      }
      h1, h2, h3, h4, h5, h6, .display-font {
        font-family: 'Playfair Display', serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-reporter" style="display:none; padding: 20px; color: red; font-family: monospace; background: #ffeeee; border: 1px solid red; margin: 20px; border-radius: 8px;">
      <h3 style="margin-top:0">Critical App Error</h3>
      <div id="error-message"></div>
      <p style="margin-top:10px; font-size:12px; color:#666">Check the browser console (F12) for more details.</p>
    </div>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('error-reporter').style.display = 'block';
        document.getElementById('error-message').innerText = message + '\nAt: ' + source + ':' + lineno;
        return false;
      };
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
